server:
  port: 8083

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      participantValidation:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

spring:
  application:
    name: trip-service
  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:changelogs/25-01-trip-changelog.xml
