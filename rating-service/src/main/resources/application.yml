server:
  port: 8085


eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      participantValidation:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

spring:
  application:
    name: rating-service
  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: by.fk8ght.task.rating.model.event.TripCompleted
        spring.json.trusted.packages: "*"

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:changelogs/04-01-rating-changelog.xml

jwt:
  secret: ${JWT_SECRET:secretsecretsecretsecretsecretsecretsecretsecretsecret}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7
