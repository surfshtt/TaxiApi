server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: passenger-service
  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:changelogs/25-01-passenger-changelog.xml

jwt:
  secret: ${JWT_SECRET:secretsecretsecretsecretsecretsecretsecretsecretsecret}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7
