server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123123123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:changelogs/credentials-changelog.xml

jwt:
  secret: ${JWT_SECRET:secretsecretsecretsecretsecretsecretsecretsecretsecret}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7
